      license_hint: This system uses fully offline licensing. Send this machine's
        hardware fingerprint to the licensor, then paste the license file signed
        with the private key below and click "Verify license" to activate locally.
        Without verification, admin settings are restricted but the frontend is
        unaffected.
      github_hint_html: 'When enabled, users can sign in with their GitHub account.
        Please go to %{docs} to create an OAuth App. Callback URL: %{callback}'
      google_hint_html: 'When enabled, users can sign in with their Google account.
        Please go to %{docs} to create an OAuth 2.0 client ID. Authorized redirect
        URI: %{callback}'
      gitee_hint_html: 'When enabled, users can sign in with their Gitee account.
        Please go to %{docs} to create an app. Callback URL: %{callback}'
      gitee_apps: Gitee Third-Party Apps
      baidu_hint_html: Used to auto-translate topic titles into English for friendly
        URLs. Please go to %{docs} to get an APPID and key.
      baidu_platform: Baidu Translate Open Platform
      email_verify_hint: When enabled, users must receive a verification code via
        email to complete registration.
      sendflare_hint_html: Uses the Sendflare email service. Please go to %{docs}
        to register and get an API Token.
      ses_hint_html: Uses the Tencent Cloud SES API. Please go to %{keys} to get SecretId
        and SecretKey, and create a sender address in the %{ses}.
      ses_console: SES console
      api_key_management: API Key Management
      registration_hint: Control the registration methods available on the frontend.
        At least one must be enabled or registration will be unavailable.
      invite_hint_html: When enabled, new users must enter a valid invitation code
        to register. Generate and manage codes in the %{mgmt} page.
      invite_mgmt: Invitation Code Management
      captcha_hint_html: When enabled, users must pass Tencent Cloud captcha on sign-in
        and sign-up, preventing brute force and bulk registration. Go to %{docs} to
        create a captcha app and get CaptchaAppId and AppSecretKey.
      captcha_console: Captcha console
      captcha_api_hint_html: Tencent Cloud SecretId/SecretKey for API signing (different
        from the captcha AppSecretKey). Please go to %{keys} to obtain them.
      modules_hint: Enable or disable frontend navigation modules. Disabled modules
        become inaccessible.
      tms_hint_html: Integrates Tencent Cloud Text Moderation (TMS) to auto-detect
        topic and comment content on publish, blocking porn, illegal and ad content.
        Go to %{docs} to enable the service and get keys.
      cms_console: CMS console
      ai_hint: Configure AI service connections, shared by comment generation, topic
        generation and more. All providers are OpenAI API compatible.
      auto_topic_hint_html: When enabled, the system auto-generates topics with AI
        daily. Creation times are randomized within the configured range for natural
        publishing. Check execution status on the %{page} page.
      auto_topics_page: AI Auto Topics
      auto_comment_hint_html: When enabled, the system auto-generates comments with
        AI daily and posts them to random topics. Comment times are randomized within
        the configured range. Check execution status on the %{page} page.
      auto_comments_page: AI Auto Comments
      ai_label_hint: When enabled, AI-generated topics and comments show an "AI" badge
        on the frontend, helping users identify content sources.
      cps_hint: Shows a CPS ad card above the hot nodes. Supports multiple ads that
        rotate on each page refresh.
      virtual_hint: Set virtual increments for the members, topics and replies counts
        shown on the homepage. Displayed value = real data + increment. E.g. actual
        members 1121 + increment 10000 displays 11121. Leave blank or 0 to disable.
      storage_hint: Choose where uploads (topic images, avatars, instructor photos,
        etc.) are stored. After switching, new uploads use the new storage; existing
        files are unaffected.
      watermark_hint_html: When enabled, COS images in topics get text watermarks
        applied in real time via Tencent Cloud CI — no server-side processing, better
        performance. Watermark changes take effect immediately. Requires COS with
        CI enabled. %{warning}
      local_no_watermark: Local images do not support COS watermark
      cos_hint_html: The following info is required when image storage is set to COS.
        Please go to %{docs} to create a bucket and get keys.
      cos_console: Object Storage console
      vod_hint_html: Course videos use Tencent Cloud VOD. After configuration you
        can upload videos directly in course management. Please go to %{keys} to get
        keys.
